name: Daily live prediction tracker

# Uses existing GitHub secrets: RENDER_BACKEND_URL and ADMIN_JOB_SECRET.
# The admin key must match Render's environment. Forecasts stay immutable.
on:
  schedule:
    - cron: '17 22 * * 1-5'  # after the US close; avoid the busy top of the hour
    - cron: '17 4 * * 2-6'   # recovery for the same session, before the next open
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-live-predictions
  cancel-in-progress: false

jobs:
  run-daily-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trigger backend prediction job
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_JOB_SECRET }}
        run: python backend/research/run_daily_collector.py
