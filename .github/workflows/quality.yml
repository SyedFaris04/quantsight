name: Evaluation and frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  serving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt httpx==0.28.1
      - run: pip check
      - run: python -m research.build_serving_snapshots --check
        working-directory: backend
      - run: python -m research.build_attribution_snapshots --check
        working-directory: backend
      - run: python -m research.build_model_health_reference --check
        working-directory: backend
      - run: python -m backtesting.periods --check
        working-directory: backend
      - run: python -m research.confidence_audit --check
        working-directory: backend
      - run: python -c "from research.xai_report import load; assert load() is not None"
        working-directory: backend
      - run: python -m research.verify_runtime
        working-directory: backend
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/supabase/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend/supabase/tests
      - run: npm test
        working-directory: backend/supabase/tests
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-evaluation.txt
      - run: pip install -r backend/requirements-evaluation.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
